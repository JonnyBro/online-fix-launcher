upd.title:
  en: "Update"
  ru: "Обновление"
upd.ask:
  en: "Version %{version} is out (you have %{current}). Update now?"
  ru: "Вышла версия %{version} (у вас %{current}). Обновить сейчас?"
upd.manual:
  en: "The launcher can't replace itself here (it was installed as a package or the folder is read-only), so the update has to be installed by hand."
  ru: "Здесь лаунчер не может заменить себя сам (он установлен пакетом или папка только для чтения), так что обновление нужно поставить вручную."
upd.install:
  en: "Update"
  ru: "Обновить"
upd.later:
  en: "Later"
  ru: "Позже"
upd.skip:
  en: "Skip this version"
  ru: "Пропустить эту версию"
upd.page:
  en: "Release page"
  ru: "Страница релиза"
upd.downloading:
  en: "Downloading the update…"
  ru: "Скачиваю обновление…"
upd.ready:
  en: "The update is installed. Restart the launcher to use it."
  ru: "Обновление установлено. Перезапустите лаунчер, чтобы им пользоваться."
upd.restart:
  en: "Restart"
  ru: "Перезапустить"
upd.restart_failed:
  en: "Couldn't restart: %{error}. Start the launcher again yourself."
  ru: "Не удалось перезапустить: %{error}. Запустите лаунчер заново вручную."
tools.rescan_fix:
  en: "Look for the fix again"
  ru: "Найти фикс заново"
game.back_up_first:
  en: "Back up the saves first"
  ru: "Сначала сделать копию сохранений"
saves.title:
  en: "Saves"
  ru: "Сохранения"
saves.back_up:
  en: "Back up now"
  ru: "Сделать копию"
saves.none:
  en: "No backups yet. They hold the prefix's AppData, Documents and Saved Games, where games and OnlineFix keep saves."
  ru: "Копий пока нет. В копию попадают AppData, Documents и Saved Games из префикса: там игры и OnlineFix хранят сохранения."
saves.restore:
  en: "Restore"
  ru: "Восстановить"
saves.restore_title:
  en: "Restore the saves?"
  ru: "Восстановить сохранения?"
saves.restore_text:
  en: "Saves from %{when} are put back into the prefix. Files with the same names are overwritten; newer files the backup doesn't have stay."
  ru: "Сохранения от %{when} вернутся в префикс. Файлы с теми же именами будут перезаписаны, а новые файлы, которых нет в копии, останутся."
set.desktop:
  en: "Application menu"
  ru: "Меню приложений"
set.desktop_add:
  en: "Add to menu"
  ru: "Добавить в меню"
set.desktop_update:
  en: "Update entry"
  ru: "Обновить ярлык"
set.desktop_remove:
  en: "Remove"
  ru: "Убрать"
set.desktop_hint:
  en: "Adds OnlineFix Launcher with its icon to the application menu. If you move the launcher, the entry points at the new place the next time you start it."
  ru: "Добавляет OnlineFix Launcher с иконкой в меню приложений. Если перенести лаунчер, при следующем запуске пункт меню укажет на новое место."
set.desktop_added:
  en: "OnlineFix Launcher is in the application menu."
  ru: "OnlineFix Launcher добавлен в меню приложений."
set.desktop_removed:
  en: "OnlineFix Launcher was removed from the application menu."
  ru: "OnlineFix Launcher убран из меню приложений."
