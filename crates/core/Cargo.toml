[package]
name = "onlinefix-launcher-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
directories = "6.0.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
pelite = "0.10.0"
reqwest = "0.13.5"
rust-i18n = "4.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shell-words = "1.1.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "process", "fs"] }
toml = "1.2.1"
tracing = "0.1.44"
xz2 = "0.1.7"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
