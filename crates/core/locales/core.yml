_version: 2
err.no_platform_dirs:
  en: "could not determine the user folders"
  ru: "не удалось определить пользовательские папки"
err.io:
  en: "I/O error at %{path}: %{source}"
  ru: "ошибка ввода-вывода (%{path}): %{source}"
err.settings_parse:
  en: "could not read settings from %{path}: %{source}"
  ru: "не удалось прочитать настройки из %{path}: %{source}"
err.settings_serialize:
  en: "could not write settings: %{error}"
  ru: "не удалось записать настройки: %{error}"
err.runtime:
  en: "could not start the background runtime: %{error}"
  ru: "не удалось запустить фоновую среду: %{error}"
err.library_parse:
  en: "could not read the game list from %{path}: %{source}"
  ru: "не удалось прочитать список игр из %{path}: %{source}"
err.exe_missing:
  en: "the game file is gone: %{path}"
  ru: "файл игры не найден: %{path}"
err.proton_missing:
  en: "no Proton build to run the game with"
  ru: "нет сборки Proton, чтобы запустить игру"
err.bad_args:
  en: "can't read the arguments: %{args}"
  ru: "не удалось разобрать аргументы: %{args}"
err.library_read_only:
  en: "the game list couldn't be read, so changes aren't saved; fix or remove games.toml"
  ru: "список игр не прочитался, поэтому изменения не сохраняются; исправьте или удалите games.toml"
err.game_running:
  en: "the game is running; stop it first"
  ru: "игра запущена; сначала остановите её"
err.launch:
  en: "could not start %{name}: %{error}"
  ru: "не удалось запустить %{name}: %{error}"
err.runtime_missing:
  en: "Steam Linux Runtime isn't installed, running without it. Install it with steam://install/%{app_id}"
  ru: "Steam Linux Runtime не установлен, запуск без него. Установить: steam://install/%{app_id}"
err.steam_not_started:
  en: "Steam didn't start or nobody signed in"
  ru: "Steam не запустился или вход не выполнен"
err.game_quit:
  en: "%{name} quit right away (code %{code}); its log may say why"
  ru: "%{name} сразу закрылась (код %{code}); причина может быть в её логе"
game.removed:
  en: "%{name} removed"
  ru: "%{name} удалена"
err.not_deleting:
  en: "not deleting %{path}: it's too high up or holds the launcher's or Steam's files"
  ru: "%{path} не удалена: папка слишком близко к корню или содержит файлы лаунчера или Steam"
err.delete_failed:
  en: "could not delete %{path}: %{error}"
  ru: "не удалось удалить %{path}: %{error}"
err.no_archiver:
  en: "unpacking needs 7z (the 7zip package) or, for RAR, unrar"
  ru: "для распаковки нужен 7z (пакет 7zip) или, для RAR, unrar"
err.archive_password:
  en: "wrong archive password"
  ru: "неверный пароль архива"
err.archive:
  en: "archive error: %{error}"
  ru: "ошибка архива: %{error}"
err.sgdb_key:
  en: "SteamGridDB didn't accept the API key"
  ru: "SteamGridDB не принял API-ключ"
err.unpack:
  en: "could not unpack %{name}: %{error}"
  ru: "не удалось распаковать %{name}: %{error}"
err.folder_not_empty:
  en: "%{path} already exists and isn't empty"
  ru: "%{path} уже существует и не пуста"
err.not_a_source:
  en: "pick a game folder, an archive or an .exe"
  ru: "выберите папку игры, архив или .exe"
err.sgdb_no_key:
  en: "add a SteamGridDB API key in the settings first"
  ru: "сначала укажите API-ключ SteamGridDB в настройках"
err.not_a_picture:
  en: "that link isn't a picture"
  ru: "по ссылке не картинка"
err.proton_checksum:
  en: "the download is damaged (checksum mismatch); try again"
  ru: "скачанный файл повреждён (не сходится контрольная сумма); попробуйте снова"
err.proton_layout:
  en: "the archive isn't laid out like a Proton build"
  ru: "архив устроен не как сборка Proton"
proton.installed:
  en: "%{name} installed"
  ru: "%{name} установлен"
err.proton_install:
  en: "could not install %{name}: %{error}"
  ru: "не удалось установить %{name}: %{error}"
err.proton_not_ours:
  en: "only builds the launcher downloaded can be removed here"
  ru: "удалять здесь можно только сборки, скачанные лаунчером"
